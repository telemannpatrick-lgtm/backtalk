[project]
name = "backtalk"
version = "1.0.0"
description = "Talk to your Claude Code agent out loud. Hold a key, speak, and it answers in a real voice."
requires-python = ">=3.11,<3.13"
dependencies = [
    "claude-agent-sdk>=0.2.100",
    "faster-whisper>=1.0.0",
    "httpx>=0.27.0",
    "kokoro>=0.9.0",
    # Apple Silicon only: runs the SAME whisper model on the GPU.
    # CTranslate2 (under faster-whisper) has no Metal backend, so
    # without this every Mac transcribes on the CPU. Measured 0.88s
    # -> 0.12s on an M4 Max with an identical transcript. Every other
    # platform keeps faster-whisper, which already uses CUDA.
    "mlx-whisper>=0.4.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26.0",
    "pynput>=1.8.0",
    "resemblyzer>=0.1.4",
    "setuptools<81",
    "sounddevice>=0.5.0",
    "soundfile>=0.12.0",
    # Windows has no compiler by default and upstream webrtcvad ships an
    # sdist ONLY -- no wheels for any platform -- so uv tries to build it
    # and dies demanding Visual C++ Build Tools. webrtcvad-wheels is the
    # same code with binary wheels, importing as the identical module.
    "webrtcvad>=2.0.10 ; sys_platform != 'win32'",
    "webrtcvad-wheels>=2.0.10 ; sys_platform == 'win32'",
    # Remote voice access (backtalk/remote.py): asyncio WebSocket server,
    # TLS via the standard-library ssl module.
    "websockets>=12.0,<13.0",
]

[tool.setuptools]
packages = ["backtalk"]

[tool.uv]
package = false
# resemblyzer unconditionally depends on plain `webrtcvad`, which has no
# Windows wheels and fails to build (needs MSVC Build Tools). This machine
# already gets the same importable `webrtcvad` module via `webrtcvad-wheels`
# (see the dependency list above) -- override resemblyzer's own requirement
# to a platform that never matches on this machine, so the resolver stops
# trying to build the source-only package. The actual `import webrtcvad`
# resolves fine at runtime since webrtcvad-wheels installs that same name.
override-dependencies = ["webrtcvad ; sys_platform == 'linux'"]
